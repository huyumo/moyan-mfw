<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheduler Extension</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('mfw:base-frontend:layout-preferences');
          if (raw) {
            var prefs = JSON.parse(raw);
            if (prefs && prefs.styleConfig && prefs.styleConfig.colorMode === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          console.warn('[Loading] Failed to read preferences:', e);
        }
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #loading-placeholder {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #ffffff 100%);
        z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #loading-placeholder.hidden { opacity: 0; visibility: hidden; }
      .loading-text {
        font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 500;
        color: #1e293b; letter-spacing: 2px; margin-top: 20px;
      }
      .spinner {
        width: 48px; height: 48px; border: 3px solid #e2e8f0; border-top-color: #3b82f6;
        border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading-placeholder">
      <div class="spinner"></div>
      <div class="loading-text">正在加载...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
